<body class="bg-surface text-on-surface font-body antialiased">
  <div class="min-h-[884px] max-w-[390px] mx-auto bg-surface flex flex-col relative pb-28" data-stitch-vh="min-h-[884px]===min-h-screen">

    <!-- Cabecera contextual (56px) -->
    <header class="sticky top-0 z-30 h-[56px] bg-surface border-b border-outline-variant px-gutter-lg flex items-center justify-between">
      <button data-component-id="button-icon" data-component-type="button" data-component-variant="icon" type="button" aria-label="Cerrar escáner" class="w-12 h-12 -ml-2 rounded-full text-on-surface inline-flex items-center justify-center hover:bg-surface-container">
        <span class="material-symbols-outlined text-[24px]" aria-hidden="true">close</span>
      </button>

      <h1 data-design-text-token="title-md" class="font-title text-title-md text-on-surface">Escanear Ticket o Foto</h1>

      <span class="w-12"></span>
    </header>

    <main class="flex-1 px-page-margin pt-gutter-lg flex flex-col gap-gutter-lg">

      <!-- Selector de modo -->
      <div class="grid grid-cols-2 gap-1 bg-surface-container-lowest border border-outline-variant rounded-full p-1">
        <button type="button" aria-pressed="true" class="min-h-[40px] rounded-full bg-terracotta-soft text-on-primary-container font-label text-label-md inline-flex items-center justify-center gap-1">
          <span class="material-symbols-outlined text-[18px]" aria-hidden="true">receipt_long</span>
          <span data-design-text-token="label-md">Ticket de gasto</span>
        </button>
        <button type="button" class="min-h-[40px] rounded-full text-on-surface-variant font-label text-label-md inline-flex items-center justify-center gap-1">
          <span class="material-symbols-outlined text-[18px]" aria-hidden="true">photo_camera</span>
          <span data-design-text-token="label-md">Foto de obra</span>
        </button>
      </div>

      <!-- Visor con captura del ticket -->
      <div class="relative rounded-lg overflow-hidden border border-outline-variant shadow-[0_2px_10px_rgba(15,23,42,0.04)]">
        <img src="https://lh3.googleusercontent.com/aida/ALJJyrCRjtPGTP7KNWcsICMURswqAtfemsw8n1zroDhnueiDa61k7Kxp3C5ZamR-bpUksOfV3IRw_0ZQ7M2v_XvySsMKhgfSmvTETjqF0LmP6xu6mwklhnYEvfz2agx6Ew-kL_2r2u3XHoCbYxiHrAm_unfFCm_cgGMdRjQ6G70437xsY7lm4D7L2dD74zLNxcr8oY8hAtTeKb1Za_d1JwwR813jvpOBcEX8rnppd5EZTcPyLvEaGN0R5xMeyGMDZpKK" alt="Ticket de Saneamientos García capturado para lectura offline" class="w-full h-52 object-cover">
        <div class="px-gutter-md py-gutter-sm bg-secondary text-on-secondary flex items-center justify-between">
          <div class="flex items-center gap-gutter-xs">
            <span class="material-symbols-outlined text-[16px]" aria-hidden="true">document_scanner</span>
            <span data-design-text-token="label-sm" class="font-label text-label-sm">Lectura local completada</span>
          </div>
          <span data-design-text-token="mono-sm" class="font-mono text-mono-sm tabular-nums">IVA 21%</span>
        </div>
      </div>

      <!-- Datos extraídos listos para confirmar -->
      <section class="bg-surface-warm-card border border-outline-variant rounded-lg p-gutter-lg shadow-[0_2px_10px_rgba(15,23,42,0.04)] flex flex-col gap-gutter-md">
        <div class="flex items-center justify-between">
          <h2 data-design-text-token="title-md" class="font-title text-title-md text-on-surface">Datos del ticket</h2>
          <span class="px-gutter-sm py-0.5 rounded-full bg-success-container text-on-success-container font-label text-label-sm">
            <span data-design-text-token="label-sm">Deducible 2026-T4</span>
          </span>
        </div>

        <label class="flex flex-col gap-1">
          <span data-design-text-token="label-sm" class="font-label text-label-sm text-on-surface-variant">Proveedor</span>
          <input type="text" value="Saneamientos García S.L." class="min-h-[48px] w-full rounded bg-surface-container-lowest border border-outline-variant px-gutter-md font-body text-body-md text-on-surface">
        </label>

        <div class="grid grid-cols-2 gap-gutter-sm">
          <label class="flex flex-col gap-1">
            <span data-design-text-token="label-sm" class="font-label text-label-sm text-on-surface-variant">Categoría</span>
            <select class="min-h-[48px] w-full rounded bg-surface-container-lowest border border-outline-variant px-gutter-sm font-label text-label-md text-on-surface">
              <option selected>Material</option>
              <option>Herramienta</option>
              <option>Gasoil furgoneta</option>
            </select>
          </label>
          <label class="flex flex-col gap-1">
            <span data-design-text-token="label-sm" class="font-label text-label-sm text-on-surface-variant">Vincular a obra</span>
            <select class="min-h-[48px] w-full rounded bg-surface-container-lowest border border-outline-variant px-gutter-sm font-mono text-mono-sm text-on-surface">
              <option selected>OBR-2026-001</option>
              <option>OBR-2026-014</option>
              <option>Sin obra</option>
            </select>
          </label>
        </div>

        <div class="flex flex-col gap-1 pt-gutter-sm border-t border-outline-variant">
          <div class="flex items-center justify-between">
            <span data-design-text-token="body-md" class="font-body text-body-md text-on-surface-variant">Base imponible</span>
            <span data-design-text-token="mono-md" class="font-mono text-mono-md text-on-surface tabular-nums">54,55 €</span>
          </div>
          <div class="flex items-center justify-between">
            <span data-design-text-token="body-md" class="font-body text-body-md text-on-surface-variant">IVA deducible (21%)</span>
            <span data-design-text-token="mono-md" class="font-mono text-mono-md text-on-success-container tabular-nums">11,45 €</span>
          </div>
          <div class="flex items-center justify-between pt-1 border-t border-outline-variant">
            <span data-design-text-token="title-md" class="font-title text-title-md text-on-surface">Total ticket</span>
            <span data-design-text-token="mono-lg" class="font-mono text-mono-lg text-on-surface tabular-nums">66,00 €</span>
          </div>
        </div>
      </section>

    </main>

    <!-- Acciones inferiores fijas -->
    <footer class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[390px] bg-surface-container-lowest border-t border-outline-variant p-gutter-lg shadow-[0_-4px_16px_rgba(15,23,42,0.06)] grid grid-cols-3 gap-gutter-sm z-30">
      <button data-component-id="button-tertiary" data-component-type="button" data-component-variant="tertiary" type="button" class="min-h-[48px] px-gutter-md rounded bg-surface-container text-on-surface font-label text-label-lg flex items-center justify-center">
        <span data-design-text-token="label-lg">Repetir</span>
      </button>

      <button data-component-id="button-primary" data-component-type="button" data-component-variant="primary" type="button" class="col-span-2 min-h-[48px] px-gutter-lg rounded bg-primary text-on-primary font-label text-label-lg flex items-center justify-center gap-gutter-xs shadow-sm">
        <span class="material-symbols-outlined text-[20px]" aria-hidden="true">savings</span>
        <span data-design-text-token="label-lg">Guardar en Hucha Fiscal</span>
      </button>
    </footer>

  </div>
