<body class="bg-surface text-on-surface font-body antialiased">
  <div class="min-h-[884px] max-w-[390px] mx-auto bg-surface flex flex-col relative pb-24" data-stitch-vh="min-h-[884px]===min-h-screen">

    <!-- Cabecera contextual (56px) -->
    <header class="sticky top-0 z-30 h-[56px] bg-surface border-b border-outline-variant px-gutter-lg flex items-center justify-between">
      <button data-component-id="button-icon" data-component-type="button" data-component-variant="icon" type="button" aria-label="Volver" class="w-12 h-12 -ml-2 rounded-full text-on-surface inline-flex items-center justify-center hover:bg-surface-container">
        <span class="material-symbols-outlined text-[24px]" aria-hidden="true">arrow_back</span>
      </button>

      <h1 data-design-text-token="title-md" class="font-title text-title-md text-on-surface">Ajustes y Tarifario</h1>

      <span class="w-12"></span>
    </header>

    <main class="flex-1 px-page-margin pt-gutter-lg flex flex-col gap-gutter-lg">

      <!-- Tarifa Base por Hora -->
      <section class="bg-surface-container-lowest border border-outline-variant rounded-lg p-gutter-lg shadow-[0_2px_10px_rgba(15,23,42,0.04)] flex flex-col gap-gutter-md">
        <div class="flex items-center justify-between">
          <h2 data-design-text-token="title-md" class="font-title text-title-md text-on-surface">Personalización y Tarifario</h2>
          <span class="material-symbols-outlined text-[20px] text-on-primary-container" aria-hidden="true">sell</span>
        </div>

        <label class="flex flex-col gap-gutter-xs">
          <span data-design-text-token="label-md" class="font-label text-label-md text-on-surface">Tarifa Base por Hora (€/hora)</span>
          <div class="relative flex items-center">
            <input type="text" value="38,00" class="min-h-[48px] w-full rounded bg-surface-container-low border border-outline-variant px-gutter-md pr-16 font-mono text-mono-md text-on-surface tabular-nums focus:border-terracotta focus:ring-1 focus:ring-terracotta">
            <span data-design-text-token="mono-sm" class="font-mono text-mono-sm text-on-surface-variant absolute right-gutter-md">€/hora</span>
          </div>
          <span data-design-text-token="label-sm" class="font-label text-label-sm text-on-surface-variant">Se usa para calcular presupuestos y desviaciones de jornada.</span>
        </label>
      </section>

      <!-- Mi Horario Habitual de Trabajo -->
      <section class="bg-surface-container-lowest border border-outline-variant rounded-lg p-gutter-lg shadow-[0_2px_10px_rgba(15,23,42,0.04)] flex flex-col gap-gutter-md">
        <div class="flex items-center justify-between">
          <h2 data-design-text-token="title-md" class="font-title text-title-md text-on-surface">Mi Horario Habitual de Trabajo</h2>
          <span data-design-text-token="mono-sm" class="font-mono text-mono-sm text-on-success-container bg-success-container px-gutter-sm py-0.5 rounded-full tabular-nums">8,0 h/día</span>
        </div>

        <!-- Días laborables habituales -->
        <div class="flex flex-col gap-gutter-xs">
          <span data-design-text-token="label-md" class="font-label text-label-md text-on-surface">Días laborables habituales</span>
          <div class="grid grid-cols-7 gap-1.5">
            <button type="button" aria-pressed="true" class="min-h-[44px] rounded bg-secondary text-on-secondary font-label text-label-md">L</button>
            <button type="button" aria-pressed="true" class="min-h-[44px] rounded bg-secondary text-on-secondary font-label text-label-md">M</button>
            <button type="button" aria-pressed="true" class="min-h-[44px] rounded bg-secondary text-on-secondary font-label text-label-md">X</button>
            <button type="button" aria-pressed="true" class="min-h-[44px] rounded bg-secondary text-on-secondary font-label text-label-md">J</button>
            <button type="button" aria-pressed="true" class="min-h-[44px] rounded bg-secondary text-on-secondary font-label text-label-md">V</button>
            <button type="button" aria-pressed="false" class="min-h-[44px] rounded bg-surface-container-low border border-outline-variant text-on-surface-variant font-label text-label-md">S</button>
            <button type="button" aria-pressed="false" class="min-h-[44px] rounded bg-surface-container-low border border-outline-variant text-on-surface-variant font-label text-label-md">D</button>
          </div>
        </div>

        <!-- Tramo horario fijo por defecto -->
        <div class="flex flex-col gap-gutter-sm">
          <div class="flex items-center justify-between bg-surface-container-low rounded-md p-gutter-md">
            <div class="flex flex-col">
              <span data-design-text-token="label-md" class="font-label text-label-md text-on-surface">Mañana</span>
              <span data-design-text-token="label-sm" class="font-label text-label-sm text-on-surface-variant">6,0 h</span>
            </div>
            <div class="flex items-center gap-gutter-xs">
              <input type="text" value="08:00" class="min-h-[44px] w-20 text-center rounded bg-surface-container-lowest border border-outline-variant font-mono text-mono-sm text-on-surface tabular-nums">
              <span class="text-outline">–</span>
              <input type="text" value="14:00" class="min-h-[44px] w-20 text-center rounded bg-surface-container-lowest border border-outline-variant font-mono text-mono-sm text-on-surface tabular-nums">
            </div>
          </div>

          <div class="flex items-center justify-between bg-surface-container-low rounded-md p-gutter-md">
            <div class="flex flex-col">
              <span data-design-text-token="label-md" class="font-label text-label-md text-on-surface">Tarde</span>
              <span data-design-text-token="label-sm" class="font-label text-label-sm text-on-surface-variant">2,0 h</span>
            </div>
            <div class="flex items-center gap-gutter-xs">
              <input type="text" value="15:00" class="min-h-[44px] w-20 text-center rounded bg-surface-container-lowest border border-outline-variant font-mono text-mono-sm text-on-surface tabular-nums">
              <span class="text-outline">–</span>
              <input type="text" value="17:00" class="min-h-[44px] w-20 text-center rounded bg-surface-container-lowest border border-outline-variant font-mono text-mono-sm text-on-surface tabular-nums">
            </div>
          </div>
        </div>

        <!-- Switch aplicación automática -->
        <label class="flex items-center justify-between gap-gutter-md min-h-[48px] px-gutter-md py-gutter-sm rounded bg-terracotta-soft border border-outline-variant cursor-pointer">
          <span data-design-text-token="body-md" class="font-body text-body-md text-on-primary-container text-pretty">Aplicar automáticamente este horario al crear una obra con fechas</span>
          <input type="checkbox" checked class="w-5 h-5 rounded border-outline text-terracotta focus:ring-terracotta shrink-0">
        </label>
      </section>

      <!-- Datos fiscales y almacenamiento local -->
      <section class="bg-surface-container-lowest border border-outline-variant rounded-lg p-gutter-lg shadow-[0_2px_10px_rgba(15,23,42,0.04)] flex flex-col gap-gutter-sm">

          <h2 data-design-text-token="title-md" class="font-title text-title-md text-on-surface">Datos del autónomo</h2>

        </div>
        <p data-design-text-token="body-md" class="font-body text-body-md text-on-surface-variant">Carlos Mendoza · NIF 50918273L · Madrid</p>

      <a href="#inicio" class="min-w-[64px] min-h-[48px] flex flex-col items-center justify-center gap-0.5 text-on-surface-variant hover:text-on-surface">
        <span class="material-symbols-outlined text-[24px]" aria-hidden="true">home</span>
        <span data-design-text-token="label-sm" class="font-label text-label-sm">Inicio</span>
      </a>

      <button data-component-id="button-with-icon" data-component-type="button" data-component-variant="with-icon" type="button" class="-mt-4 min-h-[52px] px-gutter-xl rounded-full bg-terracotta text-on-primary font-label text-label-lg inline-flex items-center justify-center gap-gutter-sm shadow-md active:scale-[0.97] transition-transform duration-state-change ease-state-change">
        <span class="material-symbols-outlined text-[22px]" aria-hidden="true">mic</span>
        <span data-design-text-token="label-lg">Voz</span>
      </button>

        <span class="material-symbols-outlined text-[24px]" aria-hidden="true">photo_camera</span>
        <span data-design-text-token="label-sm" class="font-label text-label-sm">Cámara</span>
      </button>
    </nav>
